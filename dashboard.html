<!DOCTYPE html>
<html>
<head>
    <title>My Notes</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    <link rel="stylesheet" href="frontend/dashboard_styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <script>
        if (!localStorage.getItem('token')) window.location.href = "index.html";
    </script>

    <div class="navbar">
        <div class="nav-left">
            <button class="nav-btn active" id="allNotesBtn" onclick="showAllNotes()">All Notes</button>
            <button class="nav-btn" id="importantBtn" onclick="showImportantNotes()">Important</button>
        </div>
        <div class="nav-right">
            <button class="nav-btn add-btn" onclick="toggleAddForm()">
                <i class="fa-solid fa-plus"></i> New Note
            </button>
            <button class="signout-btn" onclick="logout()">Sign Out</button>
        </div>
    </div>

    <div id="addForm" class="add-form hidden">
        <input id="taskInput" placeholder="Note title..." onkeydown="if(event.key==='Enter') addTask()">
        <div class="add-form-actions">
            <button class="save-new-btn" onclick="addTask()">Save</button>
            <button class="cancel-btn" onclick="toggleAddForm()">Cancel</button>
        </div>
    </div>

    <div class="search-bar-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input id="searchInput" class="search-input" placeholder="Search notes..." oninput="filterNotes()">
    </div>

    <div id="notesContainer"></div>

    <script src="frontend/dashboard_script.js"></script>
</body>
</html>
